<!DOCTYPE html>
<html lang="vi" data-required-role="admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Sản Phẩm - COFFEE HDTQ</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .category-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .category-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .category-card:hover {
            border-color: var(--color-accent);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .category-icon {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
        }

        .category-name {
            font-weight: 700;
            font-size: 18px;
            color: #333;
        }

        .category-count {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        .card-actions {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-brand">
            
            <span>COFFEE HDTQ</span>
        </div>
        <div class="navbar-menu">
            <ul>
                <li><a href="/pages/dashboard.html">Trang Chủ</a></li>
                <li><a href="/pages/tables.html">Bàn</a></li>
                <li data-for-role="admin"><a href="/pages/products.html">Sản Phẩm</a></li>
                <li data-for-role="admin"><a href="/pages/inventory.html">Kho Hàng</a></li>
                <li data-for-role="admin"><a href="/pages/employees.html">Nhân Viên</a></li>
                <li data-for-role="admin"><a href="/pages/reports.html">Báo Cáo</a></li>
            </ul>
        </div>
        <div class="navbar-right">
            <div class="navbar-user">
                <span id="user-name">User</span>
                <div class="user-avatar" id="user-avatar">U</div>
            </div>
            <button class="btn-logout" id="logout-btn">Đăng Xuất</button>
        </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar">
        <ul class="sidebar-menu">
            <li><a href="/pages/dashboard.html">🏠 Trang Chủ</a></li>
            <li><a href="/pages/tables.html">🛋️ Bàn</a></li>
            <li data-for-role="admin"><a href="/pages/products.html">📦 Sản Phẩm</a></li>
            <li data-for-role="admin"><a href="/pages/inventory.html">🏗️ Kho Hàng</a></li>
            <li data-for-role="admin"><a href="/pages/employees.html">👥 Nhân Viên</a></li>
            <li data-for-role="admin"><a href="/pages/reports.html">📈 Báo Cáo</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="category-container">
            <div class="page-header">
                <h1 class="page-title">📁 Quản Lý Danh Mục</h1>
                <button class="btn-primary" onclick="showAddModal()">+ Thêm Danh Mục</button>
            </div>

            <div class="category-list" id="category-list">
                <!-- Categories loaded here -->
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Thêm Danh Mục</h2>
            <form id="category-form" onsubmit="handleSave(event)">
                <div class="form-group">
                    <label>Tên Danh Mục</label>
                    <input type="text" id="cat-name" required>
                </div>
                <div class="form-group">
                    <label>Biểu Tượng (Emoji)</label>
                    <input type="text" id="cat-icon" placeholder="☕, 🍵, 🍰...">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="hideModal()">Hủy</button>
                    <button type="submit" class="btn-primary">Lưu Lại</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        const MOCK_CATEGORIES = [
            { id: 1, name: 'Cà Phê', icon: '☕', count: 12 },
            { id: 2, name: 'Trà Sữa', icon: '🍵', count: 8 },
            { id: 3, name: 'Nước Ép', icon: '🍊', count: 15 },
            { id: 4, name: 'Đồ Ăn Nhẹ', icon: '🥐', count: 10 },
            { id: 5, name: 'Tráng Miện', icon: '🍰', count: 6 }
        ];

        function renderCategories() {
            const list = document.getElementById('category-list');
            if (!list) return;
            list.innerHTML = MOCK_CATEGORIES.map(cat => `
                <div class="category-card">
                    <span class="category-icon">${cat.icon}</span>
                    <div class="category-name">${cat.name}</div>
                    <div class="category-count">${cat.count} sản phẩm</div>
                    <div class="card-actions">
                        <button class="btn-small btn-secondary" onclick="editCat(${cat.id})">Sửa</button>
                        <button class="btn-small btn-danger" onclick="deleteCat(${cat.id})">Xóa</button>
                    </div>
                </div>
            `).join('');
        }

        function showAddModal() {
            document.getElementById('modal-title').textContent = 'Thêm Danh Mục Mới';
            document.getElementById('category-form').reset();
            document.getElementById('category-modal').style.display = 'flex';
        }

        function hideModal() {
            document.getElementById('category-modal').style.display = 'none';
        }

        function handleSave(e) {
            e.preventDefault();
            alert('✓ Đã lưu danh mục!');
            hideModal();
        }

        function editCat(id) {
            const cat = MOCK_CATEGORIES.find(c => c.id === id);
            document.getElementById('modal-title').textContent = 'Sửa Danh Mục';
            document.getElementById('cat-name').value = cat.name;
            document.getElementById('cat-icon').value = cat.icon;
            document.getElementById('category-modal').style.display = 'flex';
        }

        function deleteCat(id) {
            if(confirm('Xóa danh mục này? Tất cả sản phẩm trong danh mục sẽ được chuyển về "Chưa phân loại".')) {
                alert('✓ Đã xóa danh mục!');
            }
        }

        document.addEventListener('DOMContentLoaded', renderCategories);
    </script>
</body>
</html>
